<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>麺 Earth // 統一利用規約</title>
<style>
    :root {
        --neon-cyan: #00fff2;
        --neon-magenta: #ff2ee6;
        --neon-green: #39ff88;
        --neon-orange: #ff9d00;
        --neon-red: #ff2b52;
        --bg-void: #05060a;
        --bg-panel: rgba(15, 20, 32, 0.7);
        --border-line: rgba(0, 255, 242, 0.25);
        --text-main: #d7e6ff;
        --text-dim: #7c8aa8;
        --font-display: 'Orbitron', 'Segoe UI', sans-serif;
        --font-body: 'Noto Sans JP', 'Hiragino Sans', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
        font-family: var(--font-body);
        background: var(--bg-void);
        color: var(--text-main);
        line-height: 1.85;
        min-height: 100vh;
        overflow-x: hidden;
        position: relative;
    }

    .bg-grid {
        position: fixed;
        inset: 0;
        z-index: 0;
        background-image:
            linear-gradient(rgba(0,255,242,0.06) 1px, transparent 1px),
            linear-gradient(90deg, rgba(0,255,242,0.06) 1px, transparent 1px);
        background-size: 48px 48px;
        animation: gridDrift 30s linear infinite;
        mask-image: radial-gradient(ellipse 90% 70% at 50% 20%, black 40%, transparent 100%);
    }

    @keyframes gridDrift {
        0% { background-position: 0 0; }
        100% { background-position: 48px 96px; }
    }

    .bg-glow {
        position: fixed;
        inset: 0;
        z-index: 0;
        background:
            radial-gradient(600px circle at 15% 10%, rgba(255,46,230,0.12), transparent 60%),
            radial-gradient(700px circle at 85% 25%, rgba(0,255,242,0.10), transparent 60%),
            radial-gradient(500px circle at 50% 90%, rgba(57,255,136,0.08), transparent 60%);
        pointer-events: none;
    }

    .scanline {
        position: fixed;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        background: repeating-linear-gradient(
            to bottom,
            rgba(255,255,255,0.015) 0px,
            rgba(255,255,255,0.015) 1px,
            transparent 1px,
            transparent 3px
        );
        opacity: 0.5;
    }

    .scan-beam {
        position: fixed;
        left: 0; right: 0;
        height: 120px;
        z-index: 1;
        pointer-events: none;
        background: linear-gradient(to bottom, transparent, rgba(0,255,242,0.06), transparent);
        animation: beamSweep 8s ease-in-out infinite;
    }

    @keyframes beamSweep {
        0%, 100% { top: -120px; opacity: 0; }
        10% { opacity: 1; }
        50% { top: 100vh; opacity: 1; }
        60% { opacity: 0; }
    }

    .container {
        position: relative;
        z-index: 2;
        max-width: 1000px;
        margin: 0 auto;
        padding: 20px;
    }

    header {
        text-align: center;
        padding: 60px 20px 50px;
        position: relative;
    }

    .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 0.75rem;
        letter-spacing: 0.35em;
        color: var(--neon-cyan);
        text-transform: uppercase;
        margin-bottom: 20px;
        opacity: 0;
        animation: fadeSlideUp 0.8s ease forwards 0.1s;
    }

    .eyebrow::before, .eyebrow::after {
        content: '';
        width: 30px;
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--neon-cyan));
    }
    .eyebrow::after { background: linear-gradient(90deg, var(--neon-cyan), transparent); }

    .pulse-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--neon-green);
        box-shadow: 0 0 8px var(--neon-green);
        animation: pulseDot 1.6s ease-in-out infinite;
    }

    @keyframes pulseDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.7); }
    }

    h1 {
        font-family: var(--font-display), var(--font-body);
        font-size: clamp(2.2rem, 6vw, 3.6rem);
        font-weight: 900;
        letter-spacing: 0.04em;
        background: linear-gradient(120deg, var(--neon-cyan) 0%, #fff 40%, var(--neon-magenta) 80%);
        background-size: 200% auto;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: fadeSlideUp 0.8s ease forwards 0.25s, shimmer 6s linear infinite 1s;
        opacity: 0;
        position: relative;
    }

    h1::after {
        content: '麺 EARTH';
        position: absolute;
        left: 0; top: 0;
        width: 100%;
        color: var(--neon-magenta);
        opacity: 0;
        -webkit-text-fill-color: var(--neon-magenta);
        mix-blend-mode: screen;
        animation: glitchFlicker 7s ease-in-out infinite;
        z-index: -1;
    }

    @keyframes glitchFlicker {
        0%, 96%, 100% { opacity: 0; transform: translate(0); }
        96.5% { opacity: 0.7; transform: translate(-3px, 1px); }
        97% { opacity: 0; }
        97.5% { opacity: 0.5; transform: translate(3px, -1px); }
        98% { opacity: 0; }
    }

    @keyframes shimmer {
        0% { background-position: 0% center; }
        100% { background-position: 200% center; }
    }

    .subtitle {
        color: var(--text-dim);
        font-size: 1.05rem;
        letter-spacing: 0.15em;
        margin-top: 14px;
        opacity: 0;
        animation: fadeSlideUp 0.8s ease forwards 0.4s;
    }

    .subtitle .accent { color: var(--neon-cyan); }

    @keyframes fadeSlideUp {
        from { opacity: 0; transform: translateY(16px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .controls {
        display: flex;
        gap: 12px;
        margin-bottom: 10px;
        flex-wrap: wrap;
        align-items: center;
        opacity: 0;
        animation: fadeSlideUp 0.8s ease forwards 0.55s;
    }

    .search-wrap {
        flex: 1;
        min-width: 220px;
        position: relative;
        display: flex;
        align-items: center;
    }

    .search-icon {
        position: absolute;
        left: 16px;
        width: 16px;
        height: 16px;
        color: var(--neon-cyan);
        pointer-events: none;
        opacity: 0.8;
    }

    .search-box {
        width: 100%;
        padding: 14px 16px 14px 44px;
        background: var(--bg-panel);
        backdrop-filter: blur(12px);
        border: 1px solid var(--border-line);
        border-radius: 8px;
        color: var(--text-main);
        font-size: 0.95rem;
        font-family: var(--font-body);
        transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }

    .search-box::placeholder { color: var(--text-dim); }

    .search-box:focus {
        outline: none;
        border-color: var(--neon-cyan);
        box-shadow: 0 0 0 3px rgba(0,255,242,0.12), 0 0 24px rgba(0,255,242,0.15);
    }

    .search-status {
        font-size: 0.78rem;
        color: var(--neon-green);
        margin: 8px 0 26px;
        min-height: 16px;
        letter-spacing: 0.03em;
        padding-left: 4px;
        transition: color 0.2s ease;
    }

    .search-status.none { color: var(--neon-red); }

    button {
        padding: 14px 22px;
        background: transparent;
        color: var(--neon-cyan);
        border: 1px solid var(--border-line);
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        font-size: 0.88rem;
        letter-spacing: 0.05em;
        white-space: nowrap;
        position: relative;
        overflow: hidden;
        transition: color 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease, transform 0.15s ease;
    }

    button::before {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, transparent, rgba(0,255,242,0.25), transparent);
        transform: translateX(-120%);
        transition: transform 0.5s ease;
    }

    button:hover {
        border-color: var(--neon-cyan);
        box-shadow: 0 0 18px rgba(0,255,242,0.25);
        color: #fff;
    }

    button:hover::before { transform: translateX(120%); }
    button:active { transform: scale(0.96); }

    .btn-group { display: flex; gap: 10px; }

    .table-of-contents {
        background: var(--bg-panel);
        backdrop-filter: blur(12px);
        padding: 24px;
        border-radius: 10px;
        margin-bottom: 30px;
        border: 1px solid var(--border-line);
        position: relative;
        opacity: 0;
        animation: fadeSlideUp 0.8s ease forwards 0.7s;
    }

    .table-of-contents::before {
        content: '';
        position: absolute;
        top: -1px; left: 20px; right: 20px;
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent);
    }

    .table-of-contents h2 {
        font-family: var(--font-display), var(--font-body);
        font-size: 1rem;
        letter-spacing: 0.15em;
        margin-bottom: 16px;
        color: var(--neon-cyan);
        text-transform: uppercase;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .toc-list {
        list-style: none;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 4px;
    }

    .toc-list li { border-bottom: 1px solid rgba(255,255,255,0.05); }

    .toc-list a {
        color: var(--text-dim);
        text-decoration: none;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 6px;
        font-size: 0.9rem;
        transition: color 0.2s ease, padding-left 0.2s ease;
        border-radius: 4px;
    }

    .toc-list a .num {
        color: var(--neon-cyan);
        font-family: var(--font-display), var(--font-body);
        font-size: 0.75rem;
        opacity: 0.7;
    }

    .toc-list a:hover {
        color: #fff;
        padding-left: 12px;
        background: rgba(0,255,242,0.05);
    }

    .chapters { display: flex; flex-direction: column; gap: 16px; }

    .chapter {
        background: var(--bg-panel);
        backdrop-filter: blur(12px);
        border-radius: 10px;
        border: 1px solid var(--border-line);
        overflow: hidden;
        opacity: 0;
        transform: translateY(20px);
        animation: chapterIn 0.6s ease forwards;
        transition: border-color 0.3s ease, box-shadow 0.3s ease;
        scroll-margin-top: 20px;
    }

    .chapter:hover { border-color: rgba(0,255,242,0.45); }

    @keyframes chapterIn {
        to { opacity: 1; transform: translateY(0); }
    }

    .chapter.hidden { display: none; }

    .chapter-header {
        padding: 20px 22px;
        cursor: pointer;
        user-select: none;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        transition: background 0.25s ease;
        position: relative;
    }

    .chapter-header:hover { background: rgba(0,255,242,0.04); }

    .chapter-header-left {
        display: flex;
        align-items: center;
        gap: 14px;
        min-width: 0;
    }

    .chapter-index {
        font-family: var(--font-display), var(--font-body);
        font-size: 0.75rem;
        color: var(--bg-void);
        background: var(--neon-cyan);
        width: 30px;
        height: 30px;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        box-shadow: 0 0 14px rgba(0,255,242,0.4);
    }

    .chapter-header h2 {
        font-size: 1.05rem;
        color: var(--text-main);
        margin: 0;
        font-weight: 600;
        letter-spacing: 0.02em;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .toggle-icon {
        font-size: 1rem;
        color: var(--neon-cyan);
        transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        flex-shrink: 0;
    }

    .chapter.collapsed .toggle-icon { transform: rotate(-90deg); }

    .chapter-content {
        display: grid;
        grid-template-rows: 1fr;
        transition: grid-template-rows 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .chapter.collapsed .chapter-content { grid-template-rows: 0fr; }

    .chapter-content-inner {
        overflow: hidden;
        padding: 18px 22px 22px;
        border-top: 1px solid rgba(255,255,255,0.06);
    }

    .chapter.collapsed .chapter-content-inner { padding-top: 0; padding-bottom: 0; border-top-color: transparent; }

    .section { margin-bottom: 22px; }
    .section:last-child { margin-bottom: 0; }

    .section h3 {
        color: var(--neon-cyan);
        font-size: 0.98rem;
        margin-bottom: 10px;
        margin-top: 4px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .section h3::before {
        content: '';
        width: 3px;
        height: 14px;
        background: var(--neon-cyan);
        box-shadow: 0 0 6px var(--neon-cyan);
        border-radius: 2px;
    }

    .section-content { color: var(--text-dim); line-height: 1.85; font-size: 0.95rem; }

    .subsection {
        margin-left: 8px;
        margin-bottom: 13px;
        padding-left: 14px;
        border-left: 2px solid rgba(0,255,242,0.25);
        transition: border-color 0.2s ease;
    }

    .subsection:hover { border-left-color: var(--neon-cyan); }
    .subsection strong { color: var(--text-main); }

    .warning-box, .danger-box {
        padding: 16px 18px;
        margin: 0 0 18px;
        border-radius: 8px;
        font-size: 0.92rem;
        display: flex;
        align-items: flex-start;
        gap: 10px;
        position: relative;
        overflow: hidden;
    }

    .warning-box {
        background: rgba(255, 157, 0, 0.08);
        border: 1px solid rgba(255, 157, 0, 0.35);
        color: #ffcf8a;
    }

    .danger-box {
        background: rgba(255, 43, 82, 0.08);
        border: 1px solid rgba(255, 43, 82, 0.4);
        color: #ff9caa;
        animation: dangerPulse 2.4s ease-in-out infinite;
    }

    @keyframes dangerPulse {
        0%, 100% { box-shadow: 0 0 0px rgba(255,43,82,0); }
        50% { box-shadow: 0 0 22px rgba(255,43,82,0.18); }
    }

    mark.hit {
        background: rgba(0, 255, 242, 0.25);
        color: #fff;
        padding: 1px 3px;
        border-radius: 3px;
        box-shadow: 0 0 8px rgba(0,255,242,0.4);
    }

    footer {
        text-align: center;
        padding: 50px 20px 30px;
        color: var(--text-dim);
        font-size: 0.85rem;
        letter-spacing: 0.05em;
    }

    footer .line {
        width: 80px;
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent);
        margin: 0 auto 20px;
    }

    footer p { margin-bottom: 6px; }

    .to-top {
        position: fixed;
        bottom: 24px;
        right: 24px;
        width: 46px;
        height: 46px;
        border-radius: 50%;
        background: var(--bg-panel);
        backdrop-filter: blur(10px);
        border: 1px solid var(--neon-cyan);
        color: var(--neon-cyan);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 10;
        opacity: 0;
        pointer-events: none;
        transform: translateY(10px);
        transition: opacity 0.3s ease, transform 0.3s ease, box-shadow 0.3s ease;
        font-size: 1.1rem;
    }

    .to-top.visible { opacity: 1; pointer-events: auto; transform: translateY(0); }
    .to-top:hover { box-shadow: 0 0 20px rgba(0,255,242,0.4); }

    @media (max-width: 600px) {
        h1 { font-size: 1.9rem; }
        .controls { flex-direction: column; align-items: stretch; }
        .btn-group { flex-direction: column; }
        .chapter-header h2 { font-size: 0.92rem; }
        .toc-list { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
            animation-duration: 0.01ms !important;
            animation-iteration-count: 1 !important;
            transition-duration: 0.01ms !important;
            scroll-behavior: auto !important;
        }
    }
</style>
</head>
<body>
    <div class="bg-grid"></div>
    <div class="bg-glow"></div>
    <div class="scanline"></div>
    <div class="scan-beam"></div>

    <div class="container">
        <header>
            <div class="eyebrow"><span class="pulse-dot"></span> SYSTEM // TERMS OF SERVICE ONLINE</div>
            <h1 id="mainTitle">麺 EARTH</h1>
            <div class="subtitle">統一利用規約 <span class="accent">// UNIFIED TERMS PROTOCOL</span></div>

        <div class="controls">
            <div class="search-wrap">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="7"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" class="search-box" id="searchBox" placeholder="規約データベースを検索... (例: PK, BAN, TNT)" autocomplete="off">

                <button id="expandBtn" type="button">すべて展開</button>

        <div class="table-of-contents">

            <ul class="toc-list" id="tocList"></ul>

        <div class="chapters" id="chaptersContainer"></div>

        <footer>
            <div class="line"></div>
            <p>麺 EARTH 統一利用規約 — UNIFIED TERMS OF SERVICE</p>
            <p style="margin-top:16px; opacity:0.6;">LAST SYNC: 2026.08</p>
        </footer>
    </div>

    <div class="to-top" id="toTop" title="トップへ戻る">↑</div>

<script>
(function () {
    "use strict";

    const chapters = [
        {
            id: "chapter1",
            title: "第1章 総則",
            sections: [
                { h: "第1条 目的および本規約の適用", body: [

                { h: "第2条 規約の構成・改定", body: [
                    "1. 本規約は章立てで構成され、運営が必要と判断した場合、ユーザーの個別の同意を得ることなく、いつでも内容の変更、追加、廃止を行うことができます。",

                { h: "第3条 用語の定義", body: [

                    "「ミュート」：チャット発言やコマンド使用を一定期間制限する措置。",
                    "「期限 BAN」：定められた期間（7日、30日、90日等）、接続を禁止する措置。",

        },
        {
            id: "chapter2",

                { h: "第2条 管理権限者の指示遵守", body: [
                    "ユーザーは、ゲーム内外を問わず、管理権限者の指示、裁定、誘導に従わなければなりません。これに反抗し、運営業務を妨害する行為は処分の対象となります。"
                ]},
                { h: "第3条 禁止される発言・コンテンツ", body: [
                    "以下の行為を、チャット、看板、本・羽ペン、Discord、LINE オープンチャット等のあらゆる媒体で禁止します。",
                    "1. 不適切な表現：挑発、暴言、差別的発言（人種、性別、機種、特定の利用者への過度な差別等）、過度な下ネタ（R18表現）、公序良俗に反する内容。また、Discord内で中指スタンプその他不適切だと思われるスタンプを禁止します",

    const chaptersContainer = document.getElementById('chaptersContainer');

    function escapeHtml(str) {
        return str
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');
    }

    chapters.forEach((ch, idx) => {
        const li = document.createElement('li');
        li.innerHTML = '<a href="#' + ch.id + '"><span class="num">' + String(idx + 1).padStart(2, '0') + '</span>' + escapeHtml(ch.title) + '</a>';
        tocList.appendChild(li);

        const chapterEl = document.createElement('div');
        chapterEl.className = 'chapter collapsed';
        chapterEl.id = ch.id;
        chapterEl.style.animationDelay = (0.05 * idx) + 's';

        let innerHtml = '';
        if (ch.warning) {
            innerHtml += '<div class="warning-box">⚠️ <span>' + escapeHtml(ch.warning) + '</span></div>';
        }
        if (ch.danger) {
            innerHtml += '<div class="danger-box">🚫 <span>' + escapeHtml(ch.danger) + '</span></div>';
        }

        ch.sections.forEach(sec => {
            innerHtml += '<div class="section">';
            if (sec.h) innerHtml += '<h3>' + escapeHtml(sec.h) + '</h3>';
            innerHtml += '<div class="section-content">';
            sec.body.forEach(line => {
                innerHtml += '<div class="subsection">' + escapeHtml(line) + '</div>';
            });
            innerHtml += '</div></div>';
        });

        chapterEl.innerHTML =
            '<div class="chapter-header" data-toggle>' +
                '<div class="chapter-header-left">' +
                    '<div class="chapter-index">' + String(idx + 1).padStart(2, '0') + '</div>' +
                    '<h2>' + escapeHtml(ch.title) + '</h2>' +
                '</div>' +
                '<div class="toggle-icon">▶</div>' +
            '</div>' +
            '<div class="chapter-content">' +
                '<div class="chapter-content-inner">' + innerHtml + '</div>' +
            '</div>';

        chaptersContainer.appendChild(chapterEl);
    });

    chaptersContainer.addEventListener('click', function (e) {
        const header = e.target.closest('[data-toggle]');

        });
    }

    function highlightText(root, term) {

        if (!term) return;

        const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
        const nodes = [];
        while (walker.nextNode()) nodes.push(walker.currentNode);

        const lowerTerm = term.toLowerCase();
        nodes.forEach(node => {
            const text = node.nodeValue;
            const lowerText = text.toLowerCase();
            if (!lowerText.includes(lowerTerm)) return;

            const frag = document.createDocumentFragment();
            let cursor = 0;
            let idx;
            while ((idx = lowerText.indexOf(lowerTerm, cursor)) !== -1) {
                if (idx > cursor) frag.appendChild(document.createTextNode(text.slice(cursor, idx)));
                const mark = document.createElement('mark');
                mark.className = 'hit';
                mark.textContent = text.slice(idx, idx + term.length);
                frag.appendChild(mark);
                cursor = idx + term.length;
            }
            if (cursor < text.length) frag.appendChild(document.createTextNode(text.slice(cursor)));
            node.parentNode.replaceChild(frag, node);
        });
    }

    function escapeRegExp(s) {
        return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function runSearch(rawTerm) {
        const term = rawTerm.trim();
        const chapterEls = document.querySelectorAll('.chapter');
        let visibleCount = 0;
        let hitCount = 0;

        chapterEls.forEach(chapterEl => {
            clearHighlights(chapterEl);

            if (!term) {
                chapterEl.classList.remove('hidden');
                chapterEl.classList.add('collapsed');
                visibleCount++;
                return;
            }

            const text = chapterEl.textContent.toLowerCase();
            const termLower = term.toLowerCase();
            const matches = text.includes(termLower);

            if (matches) {
                chapterEl.classList.remove('hidden');
                chapterEl.classList.remove('collapsed');
                highlightText(chapterEl.querySelector('.chapter-content-inner'), term);
                const re = new RegExp(escapeRegExp(termLower), 'g');
                const count = (text.match(re) || []).length;
                hitCount += count;
                visibleCount++;
            } else {
                chapterEl.classList.add('hidden');
            }
        });

        if (!term) {
            searchStatus.textContent = '';
            searchStatus.classList.remove('none');
        } else if (visibleCount === 0) {
            searchStatus.textContent = '⚠ 「' + term + '」に一致する条文が見つかりません';
            searchStatus.classList.add('none');
        } else {
            searchStatus.textContent = '✓ 「' + term + '」に一致：' + visibleCount + '章 / 約' + hitCount + '箇所ヒット';
            searchStatus.classList.remove('none');
        }
    }

    searchBox.addEventListener('input', function () {
        clearTimeout(debounceTimer);
        const value = this.value;
        debounceTimer = setTimeout(() => runSearch(value), 120);
    });

    document.querySelectorAll('.chapter').forEach(c => c.classList.add('collapsed'));

    const toTop = document.getElementById('toTop');
    window.addEventListener('scroll', function () {
        if (window.scrollY > 400) toTop.classList.add('visible');
        else toTop.classList.remove('visible');
    });
    toTop.addEventListener('click', function () {
        window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    tocList.addEventListener('click', function (e) {
        const a = e.target.closest('a');
        if (!a) return;
        const id = a.getAttribute('href').slice(1);
        const target = document.getElementById(id);
        if (target) {
            requestAnimationFrame(() => target.classList.remove('collapsed'));
        }
    });
})();
</script>
</body>
</html>
